      if (node.dataset.requisitionPrint) openRequisitionReport(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionPrint));
      if (node.dataset.requisitionEdit) openRequisition(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionEdit));
      if (node.dataset.requisitionNotes) openRequisitionNotes(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionNotes));
      if (node.dataset.requisitionApprove) confirmRequisitionAction(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionApprove), "approve");
      if (node.dataset.requisitionReject) confirmRequisitionAction(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionReject), "reject");
      if (node.dataset.requisitionIssue) confirmRequisitionAction(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionIssue), "issue");
      if (node.dataset.requisitionCancel) confirmRequisitionAction(state2.data.requisitions.find((item) => item.id === node.dataset.requisitionCancel), "cancel");
      if (node.dataset.selectRequisitionMaterial) selectRequisitionMaterial(node.closest("[data-requisition-line]"), node.dataset.selectRequisitionMaterial);
      if (node.hasAttribute("data-toggle-requisition-picker")) {
        const line = node.closest("[data-requisition-line]");
        const results = line.querySelector("[data-requisition-results]");
        if (results.hidden) renderRequisitionPickerResults(line, line.querySelector("[data-requisition-search]").value);
        else closeRequisitionPickers();
      }
      if (node.hasAttribute("data-add-requisition-line")) {
        const lines = $3("#requisitionLines");
        if (lines.children.length < 20) {
          lines.insertAdjacentHTML("beforeend", requisitionLineMarkup());
          updateRequisitionLineNumbers();
        }
      }
      if (node.hasAttribute("data-remove-requisition-line")) {
        const lines = $3("#requisitionLines");
        if (lines.children.length > 1) {
          node.closest("[data-requisition-line]").remove();
          updateRequisitionLineNumbers();
        }
      }
      if (node.dataset.pageKey) {
        state2[node.dataset.pageKey] = Number(node.dataset.page);
        renderView();
      }
      if (node.hasAttribute("data-close-dialog") && !state2.dialog?.saving) $3("#actionDialog").close();
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-requisition-quantity]")) event.target.setCustomValidity("");
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest("[data-requisition-picker]")) closeRequisitionPickers();
    });
  }
  bindInk();
  bind();
  setView(state2.view);
  refresh().catch((error) => toast(error.message, true));
})();

</script>
