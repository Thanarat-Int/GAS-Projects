<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-2: #f7f9f7;
  --surface-3: #eaf1ed;
  --text: #17231e;
  --muted: #708078;
  --line: #dce4df;
  --brand: #176b52;
  --brand-2: #0f5540;
  --brand-soft: #e3f1ea;
  --warning: #aa6811;
  --warning-soft: #fff1d5;
  --danger: #b43a3a;
  --danger-soft: #fde8e7;
  --info: #356b9d;
  --info-soft: #e8f1fa;
  --shadow: 0 16px 42px rgba(30, 54, 43, .07);
  --radius: 18px;
}

[data-theme="dark"] {
  --bg: #0f1512;
  --surface: #171e1a;
  --surface-2: #1c2520;
  --surface-3: #25332c;
  --text: #edf4f0;
  --muted: #9aaba2;
  --line: #2c3932;
  --brand: #43b28c;
  --brand-2: #67c7a6;
  --brand-soft: #1b392e;
  --warning: #efb34f;
  --warning-soft: #40321b;
  --danger: #ef7c76;
  --danger-soft: #412422;
  --info: #7db4e5;
  --info-soft: #1f3244;
  --shadow: 0 16px 42px rgba(0, 0, 0, .22);
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
body { margin: 0; color: var(--text); background: var(--bg); font-family: "Noto Sans Thai", system-ui, sans-serif; font-size: 14px; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
[hidden] { display: none !important; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 28px 18px 20px; display: flex; flex-direction: column; background: #102b22; color: #eef8f4; border-right: 1px solid rgba(255,255,255,.05); }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 10px 28px; }
.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #e6f1ec; color: #135c47; font-weight: 800; font-size: 12px; }
.brand strong { display: block; font-size: 15px; letter-spacing: -.2px; }
.brand small { color: #8ab2a3; font-size: 9px; letter-spacing: 1.7px; font-weight: 700; }
.nav { display: grid; gap: 6px; }
.nav-item { position: relative; border: 0; background: transparent; color: #9eb9ae; min-height: 46px; padding: 0 12px; border-radius: 12px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 9px; text-align: left; cursor: pointer; font-weight: 600; transition: .18s ease; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,.06); }
.nav-item.active { color: #fff; background: #1b7057; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.nav-icon { width: 22px; height: 22px; display: grid; place-items: center; font-size: 17px; }
.nav-count { padding: 2px 7px; min-width: 26px; border-radius: 999px; background: rgba(255,255,255,.12); text-align: center; font-size: 11px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #5fd3a9; box-shadow: 0 0 0 4px rgba(95,211,169,.1); }

.main { min-width: 0; padding: 0 38px 56px; }
.topbar { min-height: 116px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.topbar h1 { margin: 2px 0 0; font-size: clamp(24px, 3vw, 31px); line-height: 1.25; letter-spacing: -.5px; }
.eyebrow { margin: 0; color: var(--brand); font-size: 10px; line-height: 1.4; font-weight: 800; letter-spacing: 1.7px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.fiscal-select { min-width: 190px; height: 40px; }
.icon-button, .avatar, .close-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.avatar { border-color: transparent; background: var(--brand); color: white; font-weight: 700; cursor: default; }
.view { animation: enter .22s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(5px); } }

.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 15px; margin-bottom: 18px; }
.stat-card { min-height: 140px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.stat-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 16px; }
.stat-value { margin-top: 17px; font-size: 29px; font-weight: 700; line-height: 1; letter-spacing: -.6px; }
.stat-note { margin-top: 8px; color: var(--muted); font-size: 11px; }

.panel { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.overview-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(300px,.8fr); gap: 18px; }
.panel-head { min-height: 82px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 4px 0 0; font-size: 17px; letter-spacing: -.2px; }
.work-queue { padding: 6px 22px 18px; }
.queue-row { display: grid; grid-template-columns: 38px 1fr auto; gap: 13px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
.queue-row:last-child { border: 0; }
.queue-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: var(--brand-soft); color: var(--brand); font-weight: 800; }
.queue-row strong { display: block; font-size: 13px; }
.queue-row small { color: var(--muted); }
.text-button { border: 0; background: none; color: var(--brand); font-weight: 700; cursor: pointer; }
.stock-health { min-height: 244px; padding: 25px; display: grid; place-items: center; }
.empty-visual { text-align: center; color: var(--muted); }
.empty-visual .ring { width: 112px; height: 112px; margin: 0 auto 18px; display: grid; place-items: center; border: 14px solid var(--surface-3); border-top-color: var(--brand); border-radius: 50%; color: var(--text); font-size: 22px; font-weight: 700; }

.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.summary-strip div { padding: 17px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-right: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.summary-strip div:last-child { border: 0; }
.summary-strip strong { color: var(--text); font-size: 21px; }
.filters { display: flex; align-items: center; gap: 9px; }
.search { min-width: 230px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; color: var(--muted); }
.search input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; }
select, .field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--text); outline: none; transition: .15s ease; }
select { width: auto; min-width: 145px; height: 40px; padding: 0 34px 0 12px; }
select:focus, .field input:focus, .field textarea:focus, .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 13%, transparent); }
.table-panel { min-height: 400px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
th { padding: 14px 16px; background: var(--surface-2); color: var(--muted); border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; line-height: 1.55; text-align: center; vertical-align: middle; text-transform: none; letter-spacing: normal; }
td { height: 67px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px; text-align: center; vertical-align: middle; }
tbody tr { transition: background .14s ease; }
tbody tr:hover { background: var(--surface-2); }
.cell-main { display: block; max-width: 360px; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 600; }
.cell-sub { display: block; max-width: 360px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 10px; }
td .cell-main, td .cell-sub { margin-inline: auto; }
.number-cell { font-variant-numeric: tabular-nums; text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.badge.pending, .badge.warning { color: var(--warning); background: var(--warning-soft); }
.badge.approved, .badge.active, .badge.in { color: var(--brand); background: var(--brand-soft); }
.badge.rejected, .badge.inactive, .badge.out { color: var(--danger); background: var(--danger-soft); }
.badge.neutral { color: var(--muted); background: var(--surface-3); }
.badge.info { color: var(--info); background: var(--info-soft); }
.row-actions { display: flex; justify-content: center; align-items: center; gap: 6px; }
.action-button { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 11px; font-weight: 700; }
.action-button:hover { border-color: var(--brand); color: var(--brand); }
.view-icon-button { display: inline-grid; place-items: center; padding: 0; width: 36px; height: 36px; color: var(--brand); }
.view-icon-button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.action-button.strong { color: white; border-color: var(--brand); background: var(--brand); }
.action-button.danger { color: var(--danger); }
.pagination { min-height: 62px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
.page-buttons { display: flex; gap: 5px; }
.page-button { min-width: 33px; height: 33px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; }
.page-button.active { border-color: var(--brand); background: var(--brand); color: white; }
.page-button:disabled { opacity: .4; cursor: default; }
.empty-table { height: 200px; text-align: center; color: var(--muted); }
.section-actions { min-height: 58px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.primary-button, .secondary-button { min-height: 42px; padding: 0 17px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; cursor: pointer; font-weight: 700; }
.primary-button { border: 1px solid var(--brand); background: var(--brand); color: white; }
.primary-button:hover { background: var(--brand-2); }
.secondary-button { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.result-count { color: var(--muted); font-size: 11px; }

.dialog { width: min(680px, calc(100vw - 28px)); max-height: min(760px, calc(100vh - 28px)); padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 90px rgba(0,0,0,.24); }
.dialog::backdrop { background: rgba(5,15,11,.55); backdrop-filter: blur(3px); }
.dialog form { display: flex; max-height: inherit; flex-direction: column; }
.dialog-head { padding: 22px 24px 18px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 4px 0 0; font-size: 20px; }
.close-button { width: 34px; height: 34px; font-size: 21px; }
.dialog-body { padding: 22px 24px; overflow-y: auto; }
.dialog-actions { padding: 16px 24px; display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.field { display: grid; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label { color: var(--muted); font-size: 11px; font-weight: 600; }
.field input, .field textarea { min-height: 43px; padding: 9px 12px; }
.field textarea { min-height: 76px; resize: vertical; }
.field select { width: 100%; }
.source-card { grid-column: 1 / -1; padding: 14px 15px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.source-card p { margin: 0; }
.source-card small { color: var(--muted); }
.source-balance-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.source-balance-grid span { min-height: 58px; padding: 9px 10px; display: grid; align-content: center; gap: 3px; border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 10px; }
.source-balance-grid strong { color: var(--text); font-size: 14px; }
.switch-line { min-height: 43px; display: flex; align-items: center; gap: 9px; }
.switch-line input { width: 17px; height: 17px; accent-color: var(--brand); }

.toast-region { position: fixed; z-index: 50; right: 24px; bottom: 24px; display: grid; gap: 9px; }
.toast { min-width: 290px; max-width: min(420px, calc(100vw - 32px)); padding: 14px 16px; display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 10px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 12px; box-shadow: 0 16px 50px rgba(0,0,0,.16); animation: toast-in .2s ease both; }
.toast.error { border-left-color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(7px); } }
.loading { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 62%, transparent); }
.loading.show { display: grid; }
.loading span { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fiscal-hero { margin-bottom: 18px; }
.fiscal-table-panel table { min-width: 1450px; }
.fiscal-table-panel thead th { text-align: center; vertical-align: middle; line-height: 1.45; white-space: normal; }
.fiscal-table-panel thead tr:first-child th { border-right: 1px solid var(--line); }
.fiscal-table-panel tbody td:nth-child(2) { min-width: 290px; }
.note-cell { max-width: 180px; font-weight: 400; }
.fiscal-heading { padding: 23px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
.fiscal-heading h2 { margin: 4px 0; font-size: 22px; }
.fiscal-heading-actions { display: flex; align-items: center; gap: 10px; }
.muted-line { margin: 0; color: var(--muted); font-size: 12px; }
.fiscal-metrics { display: grid; grid-template-columns: repeat(4, 1fr); }
.fiscal-metrics > div { min-height: 118px; padding: 22px 24px; display: grid; align-content: center; border-right: 1px solid var(--line); }
.fiscal-metrics > div:last-child { border: 0; }
.fiscal-metrics span, .fiscal-metrics small { color: var(--muted); font-size: 11px; }
.fiscal-metrics strong { margin: 6px 0 3px; font-size: 26px; }
.fiscal-readiness { min-height: 58px; padding: 12px 24px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); font-size: 11px; }
.fiscal-readiness strong { white-space: nowrap; }
.fiscal-readiness span { color: var(--muted); }
.fiscal-readiness.warning { background: var(--warning-soft); }
.fiscal-readiness.warning strong { color: var(--warning); }
.fiscal-readiness.ready { background: var(--brand-soft); }
.fiscal-readiness.ready strong { color: var(--brand); }
.primary-button:disabled { opacity: .45; cursor: not-allowed; }

@media (max-width: 1100px) {
  .main { padding-inline: 24px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .overview-grid { grid-template-columns: 1fr; }
  .responsive-head { align-items: flex-start; flex-direction: column; }
  .responsive-head .filters { width: 100%; }
  .responsive-head .search { flex: 1; }
}

@media (max-width: 760px) {
  .app-shell { display: block; padding-bottom: 72px; }
  .sidebar { position: fixed; z-index: 30; inset: auto 0 0; width: 100%; height: 68px; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); display: block; border: 0; }
  .brand { display: none; }
  .nav { height: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .nav-item { min-height: 50px; padding: 4px; grid-template-columns: 1fr; gap: 0; justify-items: center; text-align: center; font-size: 9px; }
  .nav-icon { height: 23px; font-size: 16px; }
  .nav-count { position: absolute; top: 2px; left: calc(50% + 8px); padding: 1px 5px; min-width: 18px; font-size: 8px; }
  .main { padding: 0 14px 24px; }
  .topbar { min-height: 126px; padding-block: 14px; flex-wrap: wrap; }
  .topbar h1 { font-size: 22px; }
  .top-actions { width: 100%; gap: 5px; }
  .fiscal-select { min-width: 0; flex: 1; }
  .avatar { display: none; }
  .icon-button { width: 36px; height: 36px; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { min-height: 116px; padding: 16px; }
  .stat-value { margin-top: 12px; font-size: 24px; }
  .summary-strip { grid-template-columns: 1fr; }
  .summary-strip div { padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .summary-strip div:last-child { border-bottom: 0; }
  .panel-head { padding: 17px; }
  .filters, .responsive-head .filters { width: 100%; flex-wrap: wrap; }
  .search { min-width: 100%; width: 100%; }
  select { flex: 1; min-width: 130px; }
  .section-actions { align-items: stretch; flex-direction: column; }
  .section-actions .primary-button { width: 100%; }
  th, td { padding-inline: 12px; }
  .cell-main, .cell-sub { max-width: 220px; }
  #view-materials th:nth-child(3), #view-materials td:nth-child(3),
  #view-materials th:nth-child(5), #view-materials td:nth-child(5),
  #view-materials th:nth-child(7), #view-materials td:nth-child(7) { display: none; }
  #view-movements th:nth-child(6), #view-movements td:nth-child(6),
  #view-movements th:nth-child(7), #view-movements td:nth-child(7) { display: none; }
  .fiscal-heading { align-items: flex-start; flex-direction: column; }
  .fiscal-heading-actions { width: 100%; justify-content: space-between; }
  .fiscal-metrics { grid-template-columns: 1fr 1fr; }
  .fiscal-metrics > div { min-height: 94px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .fiscal-metrics > div:nth-child(2) { border-right: 0; }
  .fiscal-metrics > div:nth-child(3), .fiscal-metrics > div:nth-child(4) { border-bottom: 0; }
  .fiscal-readiness { align-items: flex-start; flex-direction: column; gap: 2px; }
  .source-balance-grid { grid-template-columns: 1fr 1fr; }
  .pagination { align-items: flex-start; flex-direction: column; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full, .source-card { grid-column: 1; }
  .dialog-head, .dialog-body, .dialog-actions { padding-inline: 18px; }
  .toast-region { right: 16px; bottom: 84px; }
}

@media (max-width: 430px) {
  .stats-grid { grid-template-columns: 1fr; }
  .stat-card { min-height: 104px; }
  .cell-main, .cell-sub { max-width: 150px; }
  #view-materials th:nth-child(1), #view-materials td:nth-child(1),
  #view-materials th:nth-child(4), #view-materials td:nth-child(4),
  #view-materials th:nth-child(6), #view-materials td:nth-child(6),
  #view-movements th:nth-child(1), #view-movements td:nth-child(1) { display: none; }
  #view-materials th:last-child { width: 112px; }
  .row-actions { gap: 4px; }
  .action-button { padding-inline: 7px; }
}

/* White and deep evergreen; neutral surfaces keep data visually quiet. */
:root {
  color-scheme: light;
  --bg: #f5f6f6;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --surface-3: #f0f2f1;
  --text: #202b27;
  --muted: #69716e;
  --line: #e1e5e3;
  --brand: #07543e;
  --heading-bg: #07543e;
  --nav-bg: #073e32;
  --nav-text: #ffffffd9;
  --nav-selected: #ffffff;
  --accent: #07543e;
  --accent-soft: #f0f2f1;
  --brand-2: #106b50;
  --brand-soft: #f5f6f6;
  --warning-soft: #f5f6f6;
  --danger-soft: #f5f6f6;
  --info-soft: #f5f6f6;
  --shadow: 0 2px 4px #263e3210, 0 16px 40px -24px #263e3240;
  --radius: 18px;
  --inset: inset 0 1px 0 #ffffffc0;
  --rail: #ffffff;
  --glow: #e1e5e3;
  --button-primary: #07543e;
  --button-primary-hover: #064735;
  --button-border: #cfd7d3;
  --button-hover: #f5f7f6;
  --movement-positive: #087a55;
  --movement-negative: #b42332;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121615;
  --surface: #1c211f;
  --surface-2: #222725;
  --surface-3: #2a302d;
  --text: #f5f6f6;
  --muted: #afb7b3;
  --line: #353d39;
  --brand: #f5f6f6;
  --nav-bg: #092f28;
  --accent: #07543e;
  --accent-soft: #2a302d;
  --brand-2: #ffffff;
  --brand-soft: #222725;
  --warning: #dfbd7e;
  --warning-soft: #222725;
  --danger: #f09c94;
  --danger-soft: #222725;
  --info-soft: #222725;
  --shadow: 0 2px 4px #00000010, 0 20px 48px -24px #00000090;
  --inset: inset 0 1px 0 #ffffff06;
  --rail: #1b2821;
  --glow: #203c2b;
  --button-primary: #0c674d;

/* Shared button system: restrained geometry, clear hierarchy, no decorative elevation. */
.primary-button,
.secondary-button {
  min-height: 40px;
  padding: 0 14px;
  gap: 6px;
  border-radius: 8px;
  border-width: 1px;
  border-style: solid;
  box-shadow: none;
  font-size: 13px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: 0;
  white-space: nowrap;
}
.primary-button { border-color: var(--button-primary); background: var(--button-primary); color: #ffffff; }
.primary-button:hover { border-color: var(--button-primary-hover); background: var(--button-primary-hover); }
.secondary-button { border-color: var(--button-border); background: var(--surface); color: var(--text); }
.secondary-button:hover { border-color: #9eaaa4; background: var(--button-hover); color: var(--text); }
.primary-button:disabled,
.secondary-button:disabled { opacity: .48; cursor: not-allowed; }
.button-icon { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.icon-button,
.close-button {
  border-color: var(--button-border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: none;
  color: var(--text);
}
.icon-button:hover,
.close-button:hover { border-color: #aab5b0; background: var(--button-hover); }
.icon-button svg,

.refresh-button:disabled { opacity: .55; cursor: wait; }
.refresh-button.is-refreshing svg { animation: refresh-spin .7s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.close-button { width: 36px; height: 36px; }
.action-button {
  min-width: 32px;
  height: 32px;
  padding: 0 10px;
  border-color: var(--button-border);
